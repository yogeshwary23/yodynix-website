  <style>
    html, body { margin: 0; background: #F8F6F1; }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 20px;
      background: #F8F6F1;
      transition: opacity .4s ease;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    #splash img { width: 88px; height: 88px; animation: pulse 1.6s ease-in-out infinite; }
    #splash .bar { width: 120px; height: 3px; border-radius: 3px; background: #E4E2DD; overflow: hidden; }
    #splash .bar::after {
      content: ""; display: block; width: 40%; height: 100%; border-radius: 3px;
      background: #C6A46A;
      animation: slide 1.2s ease-in-out infinite;
    }
    @keyframes pulse { 50% { transform: scale(.94); opacity: .85; } }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) { #splash img, #splash .bar::after { animation: none; } }
    .seo-content { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  </style>

  <script>
    // Fade out the splash once Flutter renders its first frame.
    function hideSplash() {
      var splash = document.getElementById('splash');
      if (!splash) return;
      splash.style.opacity = '0';
      setTimeout(function () { splash.remove(); }, 450);
    }
    window.addEventListener('flutter-first-frame', hideSplash);
    setTimeout(hideSplash, 12000); // Safety net if the event never fires.
  </script>
